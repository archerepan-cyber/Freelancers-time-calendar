<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#f5f0e8"/>
<title>Freelancer Cal</title>
<link rel="manifest" href="manifest.json"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ── VARIABLES ── */
:root {
  --bg:     #f5f0e8;
  --bg2:    rgba(255,255,255,0.8);
  --bg3:    rgba(0,0,0,0.06);
  --text:   #1a1a1a;
  --text2:  #666;
  --text3:  #aaa;
  --accent: #D0391B;
  --sep:    rgba(0,0,0,0.09);
  --st:     env(safe-area-inset-top);
  --sb:     env(safe-area-inset-bottom);
}

/* ── THEMES ── */
.t-dark  { --bg:#151515; --bg2:rgba(30,30,30,.9); --bg3:rgba(255,255,255,.07); --text:#efefef; --text2:#999; --text3:#555; --sep:rgba(255,255,255,.08); }
.t-warm  { --bg:#EFE8CB; --bg2:rgba(255,250,230,.85); --bg3:rgba(50,30,0,.06); --text:#2a1a08; --text2:#6b4a28; --text3:#b09060; --sep:rgba(0,0,0,.08); }
.t-ocean { --bg:#E2E4D2; --bg2:rgba(220,224,210,.9); --bg3:rgba(26,42,40,.06); --text:#1a2826; --text2:#3d5654; --text3:#7BA7AF; --sep:rgba(0,0,0,.08); }
.t-retro { --bg:#DCC9A9; --bg2:rgba(220,200,165,.9); --bg3:rgba(40,20,10,.06); --text:#2a1508; --text2:#7a4a20; --text3:#b08050; --sep:rgba(0,0,0,.08); }
.t-night { --bg:#080808; --bg2:rgba(18,18,18,.95); --bg3:rgba(255,255,255,.05); --text:#ddd; --text2:#777; --text3:#404040; --sep:rgba(255,255,255,.06); }

/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
input, textarea, select { font-family: inherit; user-select: text; -webkit-user-select: text; }
button { font-family: inherit; cursor: pointer; }
* { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }

/* ── BACKGROUND ── */
#bg { position: fixed; inset: 0; z-index: 0; background-size: cover; background-position: center; }
#ov { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

/* ── APP SHELL ── */
#app { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; }

/* ── SCREENS ── */
#wrap {
  flex: 1; min-height: 0;
  position: relative; overflow: hidden;
}
.scr {
  position: absolute; inset: 0;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: calc(var(--st) + 20px) 22px calc(var(--sb) + 68px);
  will-change: transform;
  transition: transform .42s cubic-bezier(.25,0.46,0.45,0.94);
  -webkit-backface-visibility: hidden;
}
#sMain { transform: translateX(0); }
#sSett { transform: translateX(100%); }

/* ── TABBAR ── */
#bar {
  flex-shrink: 0;
  height: calc(52px + var(--sb));
  padding-bottom: var(--sb);
  display: flex; align-items: center; justify-content: center; gap: 52px;
  background: var(--bg2);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: .5px solid var(--sep);
}
.tbtn { background: none; border: none; font-size: 24px; padding: 8px 12px; opacity: .35; transition: opacity .2s; touch-action: manipulation; }
.tbtn.on { opacity: 1; }

/* ── BIG DATE ── */
.big { font-family: 'DM Serif Display', serif; font-size: clamp(96px, 26vw, 144px); line-height: .88; letter-spacing: -3px; color: var(--text); }
.bigrow { display: flex; justify-content: space-between; align-items: baseline; margin: 8px 0 26px; }
.bigmon { font-size: 16px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--text); }
.bigyr  { font-size: 13px; color: var(--text3); margin-left: 6px; }
.bigdow { font-family: 'DM Serif Display', serif; font-style: italic; font-size: 16px; color: var(--text2); }

/* ── MONTH NAV ── */
.mnav { display: flex; align-items: center; margin-bottom: 10px; }
.marr { background: none; border: none; font-size: 24px; color: var(--text); opacity: .4; padding: 4px 12px; touch-action: manipulation; transition: opacity .15s; }
.marr:active { opacity: 1; }
.mlbl { flex: 1; text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); }

/* ── CALENDAR ── */
.chdr { display: grid; grid-template-columns: repeat(7,1fr); margin-bottom: 8px; }
.chdr span { text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); }
.chdr .we { color: var(--accent); }
.cgrid { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }

.dot {
  aspect-ratio: 1; border-radius: 50%;
  position: relative; touch-action: manipulation;
  transition: transform .12s ease;
  cursor: pointer;
  background: rgba(0,0,0,.08);
}
.dot.past   { background: rgba(0,0,0,.1); }
.dot.today  { background: rgba(0,0,0,0.12); box-shadow: 0 0 0 2px var(--accent); }
.dot.future { background: rgba(0,0,0,.05); }
.dot.work   { /* color set via inline style */ }
.dot.empty  { background: transparent; pointer-events: none; }
.dot.press  { transform: scale(.82); }
.dot .pip { position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,.8); display: none; }
.dot.has .pip { display: block; }

/* ── ENTRIES ── */
.slbl { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); margin: 26px 0 10px; }
.ecard {
  background: var(--bg2); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-radius: 16px; padding: 14px 16px; margin-bottom: 8px;
  border: .5px solid var(--sep); touch-action: manipulation; cursor: pointer;
}
.etop { display: flex; align-items: flex-start; gap: 10px; }
.enum { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--accent); min-width: 32px; line-height: 1; }
.einfo { flex: 1; }
.edate { font-size: 12px; color: var(--text3); }
.ename { font-size: 15px; font-weight: 500; margin-top: 2px; }
.edot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
.enums { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; }

/* ── TOTALS ── */
.tcard {
  background: var(--bg2); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-radius: 18px; padding: 18px; border: .5px solid var(--sep); margin-bottom: 24px;
}
.xrow { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: .5px solid var(--sep); font-size: 14px; color: var(--text2); }
.trow { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; }
.tlbl { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); }
.tamt { font-family: 'DM Serif Display', serif; font-size: 42px; letter-spacing: -2px; }

/* ── SETTINGS ── */
.stitle { font-family: 'DM Serif Display', serif; font-size: 34px; margin-bottom: 26px; }
.ssec { margin-bottom: 26px; }
.sseclbl { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); margin-bottom: 12px; }

.tgrid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.tcrd {
  border-radius: 14px; padding: 14px 10px 10px; cursor: pointer;
  border: 2.5px solid transparent; touch-action: manipulation;
  min-height: 68px; display: flex; flex-direction: column; justify-content: flex-end;
  transition: transform .15s, border-color .15s;
}
.tcrd.on { border-color: var(--text); }
.tcrd:active { transform: scale(.93); }
.tcn { font-size: 11px; font-weight: 600; }

.pcols { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pc {
  width: 36px; height: 36px; border-radius: 50%; touch-action: manipulation;
  border: 2.5px solid transparent; transition: transform .14s, border-color .14s; flex-shrink: 0; cursor: pointer;
}
.pc.on { border-color: var(--text); transform: scale(1.12); }
.pc:active { transform: scale(.88); }
.cwbtn {
  width: 36px; height: 36px; border-radius: 50%; touch-action: manipulation; cursor: pointer;
  background: conic-gradient(from 0deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
  position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
  border: 2.5px solid rgba(255,255,255,.5); flex-shrink: 0;
}
.cwbtn span { pointer-events: none; font-size: 14px; }
.cwbtn input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

.currow { display: flex; gap: 8px; flex-wrap: wrap; }
.curbtn {
  padding: 9px 14px; border-radius: 10px; border: .5px solid var(--sep);
  background: var(--bg3); font-size: 14px; color: var(--text); touch-action: manipulation;
  transition: background .15s, color .15s;
}
.curbtn.on { background: var(--accent); color: #fff; border-color: var(--accent); }

.bgbtn {
  display: block; width: 100%; padding: 14px; border-radius: 14px;
  background: var(--bg3); border: 1.5px dashed rgba(128,128,128,.3);
  font-size: 15px; color: var(--text2); touch-action: manipulation;
  margin-bottom: 8px; text-align: center;
}
.slrow { display: flex; align-items: center; gap: 12px; }
.slrow input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; height: 4px; }
.slrow span { font-size: 12px; color: var(--text3); }

/* ── MODAL ── */
.mover {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,.55);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .25s;
}
.mover.on { opacity: 1; pointer-events: auto; }
.msheet {
  width: 100%; max-width: 520px;
  background: var(--bg); border-radius: 24px 24px 0 0;
  padding: 14px 20px calc(var(--sb) + 20px);
  max-height: 90vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  transform: translateY(100%); transition: transform .3s cubic-bezier(.4,0,.2,1);
}
.mover.on .msheet { transform: translateY(0); }
.mdrg { width: 36px; height: 4px; border-radius: 2px; background: var(--sep); margin: 0 auto 16px; }
.mtit { font-family: 'DM Serif Display', serif; font-size: 26px; margin-bottom: 18px; color: var(--text); }
.fg { margin-bottom: 14px; }
.fl { display: block; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }
.fi { width: 100%; background: var(--bg3); border: none; border-radius: 12px; padding: 12px 14px; font-size: 16px; color: var(--text); outline: none; }
.frow { display: flex; gap: 8px; }
.frow .fg { flex: 1; }

.dcs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.dc {
  width: 30px; height: 30px; border-radius: 50%; touch-action: manipulation;
  border: 2.5px solid transparent; transition: transform .12s, border-color .12s; cursor: pointer; flex-shrink: 0;
}
.dc.on { border-color: var(--text); transform: scale(1.18); }
.dc:active { transform: scale(.85); }
.dc-cw {
  width: 30px; height: 30px; border-radius: 50%; touch-action: manipulation; cursor: pointer;
  background: conic-gradient(from 0deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
  position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
  border: 2.5px solid rgba(255,255,255,.5); flex-shrink: 0;
}
.dc-cw span { pointer-events: none; font-size: 11px; }
.dc-cw input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

.xlist .xrow2 { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.xlist .xrow2 input { flex: 1; min-width: 0; }
.xlist .xrow2 .xdel { background: none; border: none; font-size: 20px; color: var(--text3); touch-action: manipulation; flex-shrink: 0; padding: 4px; }
.addx { width: 100%; padding: 10px; border-radius: 10px; border: 1.5px dashed var(--text3); background: none; font-size: 13px; color: var(--text3); touch-action: manipulation; margin-bottom: 14px; }
.mact { display: flex; gap: 10px; margin-top: 16px; }
.btnc { flex: 1; padding: 14px; border-radius: 14px; background: var(--bg3); border: none; font-size: 15px; font-weight: 600; color: var(--text2); touch-action: manipulation; }
.btno { flex: 2; padding: 14px; border-radius: 14px; background: var(--accent); border: none; font-size: 15px; font-weight: 600; color: #fff; touch-action: manipulation; }
</style>
</head>
<body>

<div id="bg"></div>
<div id="ov"></div>

<div id="app">
  <div id="wrap">

    <!-- MAIN -->
    <div class="scr" id="sMain">
      <div class="big" id="bNum">3</div>
      <div class="bigrow">
        <div><span class="bigmon" id="bMon">МАЙ</span><span class="bigyr" id="bYr"> 2026</span></div>
        <div class="bigdow" id="bDow">Воскресенье</div>
      </div>

      <div class="mnav">
        <button class="marr" onclick="chM(-1)">‹</button>
        <div class="mlbl" id="mLbl">Май 2026</div>
        <button class="marr" onclick="chM(1)">›</button>
      </div>

      <div class="chdr">
        <span>П</span><span>В</span><span>С</span><span>Ч</span><span>П</span>
        <span class="we">С</span><span class="we">В</span>
      </div>
      <div class="cgrid" id="grid"></div>

      <div id="entWrap"></div>
      <div id="totWrap"></div>
    </div>

    <!-- SETTINGS -->
    <div class="scr" id="sSett">
      <div class="stitle">Настройки</div>

      <div class="ssec">
        <div class="sseclbl">Валюта</div>
        <div class="currow" id="curRow">
          <button class="curbtn on" onclick="setCur('₽',this)">₽ Рубль</button>
          <button class="curbtn" onclick="setCur('$',this)">$ Доллар</button>
          <button class="curbtn" onclick="setCur('€',this)">€ Евро</button>
          <button class="curbtn" onclick="setCur('₸',this)">₸ Тенге</button>
          <button class="curbtn" onclick="setCur('₴',this)">₴ Гривна</button>
        </div>
      </div>

      <div class="ssec">
        <div class="sseclbl">Тема</div>
        <div class="tgrid" id="tGrid">
          <div class="tcrd on" style="background:#f5f0e8;" data-t="default" data-c="" onclick="setTheme(this)"><div class="tcn">Пергамент</div></div>
          <div class="tcrd" style="background:#1a1a1a;" data-t="dark" data-c="t-dark" onclick="setTheme(this)"><div class="tcn" style="color:#ddd;">Ночь</div></div>
          <div class="tcrd" style="background:#EFE8CB;" data-t="warm" data-c="t-warm" onclick="setTheme(this)"><div class="tcn">Тепло</div></div>
          <div class="tcrd" style="background:#E2E4D2;" data-t="ocean" data-c="t-ocean" onclick="setTheme(this)"><div class="tcn">Океан</div></div>
          <div class="tcrd" style="background:#DCC9A9;" data-t="retro" data-c="t-retro" onclick="setTheme(this)"><div class="tcn">Ретро</div></div>
          <div class="tcrd" style="background:#080808;" data-t="night" data-c="t-night" onclick="setTheme(this)"><div class="tcn" style="color:#ddd;">Тёмная</div></div>
        </div>
      </div>

      <div class="ssec">
        <div class="sseclbl">Цвет акцента</div>
        <div class="pcols" id="pCols">
          <div class="pc" style="background:#D0391B;" onclick="setAcc('#D0391B',this)"></div>
          <div class="pc" style="background:#324E44;" onclick="setAcc('#324E44',this)"></div>
          <div class="pc" style="background:#FBC359;" onclick="setAcc('#FBC359',this)"></div>
          <div class="pc" style="background:#7BA7AF;" onclick="setAcc('#7BA7AF',this)"></div>
          <div class="pc" style="background:#9F4125;" onclick="setAcc('#9F4125',this)"></div>
          <div class="pc" style="background:#73A642;" onclick="setAcc('#73A642',this)"></div>
          <div class="pc" style="background:#4B848A;" onclick="setAcc('#4B848A',this)"></div>
          <div class="pc" style="background:#902223;" onclick="setAcc('#902223',this)"></div>
          <div class="cwbtn" title="Свой цвет">
            <span style="font-size:18px;font-weight:300;color:#fff;line-height:1;">+</span>
            <input type="color" value="#D0391B" oninput="setAcc(this.value,null)"/>
          </div>
        </div>
      </div>

      <div class="ssec">
        <div class="sseclbl">Фон приложения</div>
        <label class="bgbtn">
          📷 Выбрать фото из галереи
          <input type="file" accept="image/*" style="display:none" onchange="loadBg(event)"/>
        </label>
        <button class="bgbtn" onclick="clearBg()">✕ Убрать фото</button>
      </div>

      <div class="ssec">
        <div class="sseclbl">Затемнение фона</div>
        <div class="slrow">
          <span>Нет</span>
          <input type="range" id="ovSl" min="0" max="88" value="45" oninput="setOv(this.value)"/>
          <span>Макс</span>
        </div>
      </div>
    </div>

  </div><!-- /wrap -->

  <div id="bar">
    <button class="tbtn on" id="tbM" onclick="goTab('main')">📅</button>
    <button class="tbtn" id="tbS" onclick="goTab('sett')">⚙️</button>
  </div>
</div>

<!-- DAY MODAL -->
<div class="mover" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="msheet">
    <div class="mdrg"></div>
    <div class="mtit" id="mTit">3 мая</div>

    <div class="fg">
      <label class="fl">Цвет дня</label>
      <div class="dcs" id="dcs">
        <div class="dc on" style="background:#324E44;" data-c="#324E44" onclick="pickC('#324E44',this)"></div>
        <div class="dc" style="background:#D0391B;" data-c="#D0391B" onclick="pickC('#D0391B',this)"></div>
        <div class="dc" style="background:#FBC359;" data-c="#FBC359" onclick="pickC('#FBC359',this)"></div>
        <div class="dc" style="background:#7BA7AF;" data-c="#7BA7AF" onclick="pickC('#7BA7AF',this)"></div>
        <div class="dc" style="background:#9F4125;" data-c="#9F4125" onclick="pickC('#9F4125',this)"></div>
        <div class="dc" style="background:#73A642;" data-c="#73A642" onclick="pickC('#73A642',this)"></div>
        <div class="dc" style="background:#4E6851;" data-c="#4E6851" onclick="pickC('#4E6851',this)"></div>
        <div class="dc-cw" title="Свой цвет">
          <span style="font-size:18px;font-weight:300;color:#fff;line-height:1;">+</span>
          <input type="color" value="#324E44" oninput="pickCHex(this.value)"/>
        </div>
      </div>
    </div>

    <div class="fg">
      <label class="fl">Описание</label>
      <input class="fi" id="fLbl" placeholder="Название / комментарий"/>
    </div>

    <div class="frow">
      <div class="fg"><label class="fl">Начало</label><input class="fi" id="fS" type="time"/></div>
      <div class="fg"><label class="fl">Конец</label><input class="fi" id="fE" type="time"/></div>
    </div>

    <div class="fg">
      <label class="fl">Заработано</label>
      <input class="fi" id="fEarn" type="number" placeholder="Заработано" inputmode="decimal"/>
    </div>

    <div class="fg">
      <label class="fl">Затраты</label>
      <div class="xlist" id="xList"></div>
      <button class="addx" onclick="addX()">+ Добавить затрату</button>
    </div>

    <div class="mact">
      <button class="btnc" onclick="closeModal()">Отмена</button>
      <button class="btno" onclick="saveDay()">Сохранить</button>
    </div>
  </div>
</div>

<script>
// ── STORAGE ──
const SK = 'ftc_d1', SS = 'ftc_s1';
let days = {}, cfg = { cur:'₽', theme:'default', thcls:'', acc:'#D0391B', ov:45, bg:'' };

function load() {
  try { days = JSON.parse(localStorage.getItem(SK) || '{}'); } catch { days = {}; }
  try { Object.assign(cfg, JSON.parse(localStorage.getItem(SS) || '{}')); } catch {}
}
function saveD() { localStorage.setItem(SK, JSON.stringify(days)); }
function saveC() { localStorage.setItem(SS, JSON.stringify(cfg)); }
function dkey(y, m, d) { return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

// ── STATE ──
const now = new Date();
let vy = now.getFullYear(), vm = now.getMonth();
let eDk = null, dc = '#324E44';
const curTab_ref = { v: 'main' };

const MON  = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONG = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONU = ['ЯНВАРЬ','ФЕВРАЛЬ','МАРТ','АПРЕЛЬ','МАЙ','ИЮНЬ','ИЮЛЬ','АВГУСТ','СЕНТЯБРЬ','ОКТЯБРЬ','НОЯБРЬ','ДЕКАБРЬ'];
const DOW  = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];

// ── BOOT ──
load();
applyCfg();
renderBig();
renderCal();
renderEnt();

// ── BIG DATE ──
function renderBig() {
  const t = new Date();
  document.getElementById('bNum').textContent = t.getDate();
  document.getElementById('bMon').textContent = MONU[t.getMonth()];
  document.getElementById('bYr').textContent  = ' ' + t.getFullYear();
  document.getElementById('bDow').textContent = DOW[t.getDay()];
}
setInterval(renderBig, 30000);

// ── CALENDAR ──
function chM(d) {
  vm += d;
  if (vm < 0) { vm = 11; vy--; }
  if (vm > 11) { vm = 0; vy++; }
  renderCal();
  renderEnt();
}

function renderCal() {
  document.getElementById('mLbl').textContent = MON[vm] + ' ' + vy;
  const t = new Date();
  const tdk = dkey(t.getFullYear(), t.getMonth(), t.getDate());
  const fd = (new Date(vy, vm, 1).getDay() + 6) % 7; // Mon=0
  const dim = new Date(vy, vm+1, 0).getDate();
  let h = '';
  for (let i = 0; i < fd; i++) h += '<div class="dot empty"></div>';
  for (let d = 1; d <= dim; d++) {
    const dk = dkey(vy, vm, d);
    const dd = days[dk];
    const dt = new Date(vy, vm, d);
    const isT = dk === tdk;
    const isP = dt < new Date(t.getFullYear(), t.getMonth(), t.getDate());
    let cls = 'dot';
    let sty = '';
    if (dd && dd.color) {
      sty = `background:${dd.color};`;
      cls += ' work';
      if (isT) cls += ' today-w'; // today but has work color
    } else if (isT) { cls += ' today'; }  // ring only, no fill
    else if (isP)   { cls += ' past'; }
    else            { cls += ' future'; }
    if (dd) cls += ' has';
    h += `<div class="${cls}" style="${sty}"
      ontouchstart="ts(event,'${dk}')"
      ontouchmove="tm()"
      ontouchend="te(event,'${dk}')"
      ondblclick="clrD('${dk}')">
      <div class="pip"></div>
    </div>`;
  }
  document.getElementById('grid').innerHTML = h;
}

// ── TOUCH ──
let _t0 = 0, _mv = false, _lpt = null;

function ts(e, dk) {
  _mv = false; _t0 = Date.now();
  const el = e.currentTarget;
  el.classList.add('press');
  _lpt = setTimeout(() => {
    el.classList.remove('press');
    navigator.vibrate && navigator.vibrate(28);
    openModal(dk);
  }, 500);
}
function tm() {
  _mv = true;
  clearTimeout(_lpt);
  document.querySelectorAll('.dot.press').forEach(e => e.classList.remove('press'));
}
function te(e, dk) {
  clearTimeout(_lpt);
  e.currentTarget.classList.remove('press');
  if (_mv) return;
  if (Date.now() - _t0 < 500) tapDot(dk);
}
function tapDot(dk) {
  openModal(dk);
}
function clrD(dk) {
  delete days[dk];
  saveD(); renderCal(); renderEnt();
}

// ── MODAL ──
function openModal(dk) {
  eDk = dk;
  const [y, m, d] = dk.split('-').map(Number);
  document.getElementById('mTit').textContent = `${d} ${MONG[m-1]}`;
  const dd = days[dk] || {};
  dc = dd.color || cfg.acc || '#324E44';
  document.querySelectorAll('#dcs .dc').forEach(el => el.classList.toggle('on', el.dataset.c === dc));
  document.getElementById('fLbl').value   = dd.label || '';
  document.getElementById('fS').value     = dd.timeStart || '';
  document.getElementById('fE').value     = dd.timeEnd || '';
  document.getElementById('fEarn').value  = dd.earned || '';
  document.getElementById('xList').innerHTML = '';
  (dd.expenses || []).forEach(x => addX(x.amount, x.comment));
  document.getElementById('modal').classList.add('on');
}
function closeModal() {
  document.getElementById('modal').classList.remove('on');
  eDk = null;
}
function pickC(c, el) {
  dc = c;
  document.querySelectorAll('#dcs .dc').forEach(d => d.classList.remove('on'));
  if (el) el.classList.add('on');
}
function pickCHex(c) {
  dc = c;
  document.querySelectorAll('#dcs .dc').forEach(d => d.classList.remove('on'));
}
function addX(amount = '', comment = '') {
  const div = document.createElement('div');
  div.className = 'xrow2';
  div.innerHTML = `
    <input class="fi" type="number" placeholder="Сумма" value="${amount}" style="max-width:110px;" inputmode="decimal"/>
    <input class="fi" placeholder="На такси, еду..." value="${comment}"/>
    <button class="xdel" onclick="this.parentElement.remove()">✕</button>`;
  document.getElementById('xList').appendChild(div);
}
function saveDay() {
  if (!eDk) return;
  const xs = [];
  document.querySelectorAll('#xList .xrow2').forEach(r => {
    const ins = r.querySelectorAll('input');
    const a = parseFloat(ins[0].value) || 0;
    const c = ins[1].value.trim();
    if (a > 0 || c) xs.push({ amount: a, comment: c });
  });
  days[eDk] = {
    color:     dc,
    label:     document.getElementById('fLbl').value.trim(),
    timeStart: document.getElementById('fS').value,
    timeEnd:   document.getElementById('fE').value,
    earned:    parseFloat(document.getElementById('fEarn').value) || 0,
    expenses:  xs
  };
  saveD(); closeModal(); renderCal(); renderEnt();
}

// ── ENTRIES ──
function renderEnt() {
  const items = [];
  for (let d = 1; d <= 31; d++) {
    const dk = dkey(vy, vm, d);
    const dt = new Date(vy, vm, d);
    if (dt.getMonth() !== vm) break;
    if (days[dk]) items.push({ dk, d, dd: days[dk] });
  }
  const ew = document.getElementById('entWrap');
  const tw = document.getElementById('totWrap');
  if (!items.length) { ew.innerHTML = ''; tw.innerHTML = ''; return; }

  const cur = cfg.cur;
  let html = `<div class="slbl">${MON[vm]} ${vy}</div>`;
  let te = 0; const ax = [];

  items.forEach((it, i) => {
    const dd = it.dd;
    te += dd.earned || 0;
    (dd.expenses || []).forEach(x => ax.push({ ...x, day: it.d, lbl: dd.label }));
    const ts  = dd.timeStart && dd.timeEnd ? `${dd.timeStart}–${dd.timeEnd}` : '';
    const es  = dd.earned ? `+${cur}${dd.earned.toLocaleString()}` : '';
    const xt  = (dd.expenses || []).reduce((s, x) => s + (x.amount || 0), 0);
    const xs  = xt ? `−${cur}${xt.toLocaleString()}` : '';
    html += `<div class="ecard" onclick="openModal('${it.dk}')">
      <div class="etop">
        <div class="enum">${i+1}</div>
        <div class="einfo">
          <div class="edate">${it.d} ${MONG[vm]}</div>
          ${dd.label ? `<div class="ename">${dd.label}</div>` : ''}
        </div>
        <div class="edot" style="background:${dd.color || cfg.acc};"></div>
      </div>
      <div class="enums">
        ${ts ? `<span style="color:var(--text3);">🕐 ${ts}</span>` : ''}
        ${es ? `<span style="color:var(--accent);font-weight:600;">${es}</span>` : ''}
        ${xs ? `<span style="color:var(--text2);">${xs}</span>` : ''}
      </div>
    </div>`;
  });
  ew.innerHTML = html;

  const tx = ax.reduce((s, x) => s + (x.amount || 0), 0);
  const net = te - tx;
  let th = '';
  ax.forEach(x => {
    th += `<div class="xrow">
      <span>${x.comment || 'Затрата'} · ${x.lbl || x.day + ' ' + MONG[vm]}</span>
      <span style="color:var(--accent);">−${cur}${(x.amount||0).toLocaleString()}</span>
    </div>`;
  });
  th += `<div class="trow">
    <div class="tlbl">Итого</div>
    <div class="tamt" style="color:${net >= 0 ? 'var(--accent)' : '#c0392b'};">
      ${net >= 0 ? '+' : ''}${cur}${Math.abs(net).toLocaleString()}
    </div>
  </div>`;
  tw.innerHTML = `<div class="tcard">${th}</div>`;
}

// ── TABS ──
function goTab(tab, animate = true) {
  const ct = curTab_ref.v;
  if (tab === ct) return;
  const m = document.getElementById('sMain');
  const s = document.getElementById('sSett');
  const toR = tab === 'sett';
  const tr = animate ? 'transform .42s cubic-bezier(.25,0.46,0.45,0.94)' : 'none';
  m.style.transition = tr;
  s.style.transition = tr;
  // Use requestAnimationFrame for reliable animation
  requestAnimationFrame(() => {
    m.style.transform = toR ? 'translateX(-100%)' : 'translateX(0)';
    s.style.transform = toR ? 'translateX(0)' : 'translateX(100%)';
  });
  curTab_ref.v = tab;
  document.getElementById('tbM').classList.toggle('on', tab === 'main');
  document.getElementById('tbS').classList.toggle('on', tab === 'sett');
}

// ── SWIPE ──
(function () {
  const wrap = document.getElementById('wrap');
  const m = document.getElementById('sMain');
  const s = document.getElementById('sSett');
  let sx = 0, sy = 0, axis = null, dragging = false;

  wrap.addEventListener('touchstart', e => {
    if (document.getElementById('modal').classList.contains('on')) return;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    axis = null; dragging = false;
    m.style.transition = 'none';
    s.style.transition = 'none';
  }, { passive: true });

  wrap.addEventListener('touchmove', e => {
    if (document.getElementById('modal').classList.contains('on')) return;
    const dx = e.touches[0].clientX - sx;
    const dy = e.touches[0].clientY - sy;
    if (!axis && (Math.abs(dx) > 10 || Math.abs(dy) > 10))
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (axis !== 'x') return;
    dragging = true;
    const W = window.innerWidth;
    if (curTab_ref.v === 'main') {
      const x = Math.min(0, dx);
      m.style.transform = `translateX(${x}px)`;
      s.style.transform = `translateX(${W + x}px)`;
    } else {
      const x = Math.max(0, dx);
      s.style.transform = `translateX(${x}px)`;
      m.style.transform = `translateX(${x - W}px)`;
    }
  }, { passive: true });

  wrap.addEventListener('touchend', e => {
    if (!dragging) return;
    const dx = e.changedTouches[0].clientX - sx;
    m.style.transition = 'transform .42s cubic-bezier(.25,0.46,0.45,0.94)';
    s.style.transition = 'transform .42s cubic-bezier(.25,0.46,0.45,0.94)';
    if      (curTab_ref.v === 'main' && dx < -60) goTab('sett', false);
    else if (curTab_ref.v === 'sett' && dx >  60) goTab('main', false);
    else {
      requestAnimationFrame(() => {
        m.style.transform = curTab_ref.v === 'main' ? 'translateX(0)' : 'translateX(-100%)';
        s.style.transform = curTab_ref.v === 'sett' ? 'translateX(0)' : 'translateX(100%)';
      });
    }
    dragging = false;
  }, { passive: true });
})();

// ── SETTINGS ──
function setCur(sym, btn) {
  cfg.cur = sym; saveC();
  document.querySelectorAll('.curbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  renderEnt();
}

function setTheme(card) {
  cfg.theme = card.dataset.t;
  cfg.thcls = card.dataset.c;
  saveC();
  // Apply theme class
  const keep = [];
  document.body.className.split(' ').forEach(c => { if (!c.startsWith('t-')) keep.push(c); });
  document.body.className = (keep.join(' ') + ' ' + cfg.thcls).trim();
  // Reapply accent (theme may override)
  document.documentElement.style.setProperty('--accent', cfg.acc);
  document.querySelectorAll('.tcrd').forEach(c => c.classList.remove('on'));
  card.classList.add('on');
}

function setAcc(c, dot) {
  cfg.acc = c; saveC();
  document.documentElement.style.setProperty('--accent', c);
  document.querySelectorAll('#pCols .pc').forEach(d => d.classList.remove('on'));
  if (dot) dot.classList.add('on');
  renderEnt();
}

function setOv(v) {
  cfg.ov = v; saveC();
  document.getElementById('ov').style.background = `rgba(0,0,0,${v/100})`;
}

function loadBg(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { cfg.bg = ev.target.result; saveC(); applyBg(); };
  r.readAsDataURL(f);
  e.target.value = '';
}
function clearBg() { cfg.bg = ''; saveC(); applyBg(); }
function applyBg() {
  document.getElementById('bg').style.backgroundImage = cfg.bg ? `url(${cfg.bg})` : 'none';
  document.getElementById('ov').style.background = cfg.bg ? `rgba(0,0,0,${cfg.ov/100})` : 'rgba(0,0,0,0)';
}

function applyCfg() {
  // Theme
  if (cfg.thcls) document.body.classList.add(cfg.thcls);
  // Accent
  document.documentElement.style.setProperty('--accent', cfg.acc || '#D0391B');
  // Overlay slider
  document.getElementById('ovSl').value = cfg.ov;
  // BG
  applyBg();
  // Currency buttons
  document.querySelectorAll('.curbtn').forEach(b => {
    b.classList.toggle('on', b.textContent.startsWith(cfg.cur));
  });
  // Theme cards
  document.querySelectorAll('.tcrd').forEach(c => {
    c.classList.toggle('on', c.dataset.t === cfg.theme);
  });
}
</script>
</body>
</html>
